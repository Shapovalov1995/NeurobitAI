<!DOCTYPE html>
<html>
<head>
    <title>Neurobit Chat</title>
    <style>
        body { font-family: Arial; max-width: 600px; margin: 0 auto; padding: 20px; }
        #chat-box { height: 400px; border: 1px solid #ccc; overflow-y: scroll; padding: 10px; }
        #user-input { width: 80%; padding: 10px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; }
    </style>
</head>
<body>
    <h1>Neurobit Chat</h1>
    <div id="chat-box"></div>
    <input type="text" id="user-input" placeholder="Введите сообщение...">
    <button onclick="sendMessage()">Отправить</button>

    <script>
        function sendMessage() {
            const input = document.getElementById("user-input");
            const message = input.value.trim();
            if (!message) return;

            const chatBox = document.getElementById("chat-box");
            chatBox.innerHTML += `<p><strong>Вы:</strong> ${message}</p>`;
            input.value = "";

            fetch("/ask", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ question: message })
            })
            .then(response => response.json())
            .then(data => {
                chatBox.innerHTML += `<p><strong>Бот:</strong> ${data.answer || data.error}</p>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        }

        document.getElementById("user-input").addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendMessage();
        });
    </script>
</body>
</html>
